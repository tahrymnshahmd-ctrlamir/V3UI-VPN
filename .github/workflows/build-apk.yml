name: Build V3UI VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          mkdir project
          unzip -q ./*.zip -d project
          cd "$(dirname "$(find project -name settings.gradle | head -1)")"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: V3UI-VPN-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
